services:
  # ─── FastAPI Backend Web Service ───────────────────────────────────────────
  - type: web
    name: sera-julius-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENTITY_MODE
        value: live
      - key: DEMO_API_KEY
        value: sera-demo-2026
      - key: USE_REAL_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: sera-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sera-redis
          property: connectionString

  # ─── React Frontend Static Site ────────────────────────────────────────────
  - type: web
    name: sera-julius-frontend
    env: static
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sera-julius-backend
          property: url

databases:
  - name: sera-postgres
    region: oregon
    plan: free
    databaseName: sera_db
    user: sera_user

# Redis in-memory cache
services:
  - type: redis
    name: sera-redis
    region: oregon
    plan: free
    ipAllowList: [] # allow all internal Render services
